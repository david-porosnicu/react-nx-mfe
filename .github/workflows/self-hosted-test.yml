name: Self-Hosted Runner Smoke Test

on:
  workflow_dispatch:

jobs:
  runner-test:
    runs-on:
      - blacksmith-8vcpu-ubuntu-2404
      - ec2
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Show host info
        run: |
          echo "I’m running on:"
          uname -a
          date
